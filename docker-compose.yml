version: "3.8"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: aixp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-aixp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aixp_secure_2024}
      POSTGRES_DB: ${DB_NAME:-aixp}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - aixp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aixp} -d ${DB_NAME:-aixp}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aixp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aixp_redis_2024} --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - aixp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aixp_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: aixp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-aixpadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-aixp_minio_2024}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - aixp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: aixp-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - aixp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: aixp-celery
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-aixp}:${DB_PASSWORD:-aixp_secure_2024}@postgres:5432/${DB_NAME:-aixp}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-aixpadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-aixp_minio_2024}
      - OLLAMA_HOST=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY:-aixp_secret_key_change_me}
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - aixp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aixp-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-aixp}:${DB_PASSWORD:-aixp_secure_2024}@postgres:5432/${DB_NAME:-aixp}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-aixp_redis_2024}@redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_USER:-aixpadmin}
      - MINIO_SECRET_KEY=${MINIO_PASSWORD:-aixp_minio_2024}
      - MINIO_BUCKET=${MINIO_BUCKET:-aixp-files}
      - OLLAMA_HOST=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY:-aixp_secret_key_change_me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - aixp-network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        alembic upgrade head &&
        python -c 'from app.core.db import init_db; import asyncio; asyncio.run(init_db())' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aixp-frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=ws://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - aixp-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: aixp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - aixp-network

networks:
  aixp-network:
    driver: bridge

volumes:
  ollama-data:
